bindings:
  # Motion blur binds each step through a dynamic UBO offset.
  - name: SceneViewUBO
    kind: UniformDynamic
  - name: ViewportThemeUBO
    kind: Uniform
  - name: WorkspaceLightsUBO
    kind: Uniform
  - name: Image
    kind: Image
  - name: Sampler
    kind: Sampler
  - name: CubeSampler
    kind: Sampler
  - name: VertexBuffer
    kind: Buffer
  - name: IndexBuffer
    kind: Buffer
  - name: ModelBuffer
    kind: Buffer
  - name: Buffer
    kind: Buffer
  - name: ObjectIdBuffer
    kind: Buffer
  - name: DrawDataBuffer
    kind: Buffer
  - name: InstanceStateBuffer
    kind: Buffer
  - name: BoneDeformBuffer
    kind: Buffer
  - name: ArmatureDeformBuffer
    kind: Buffer
  - name: MorphTargetBuffer
    kind: Buffer
  - name: MorphWeightBuffer
    kind: Buffer
  - name: VertexClassBuffer
    kind: Buffer
  - name: LightBuffer
    kind: Buffer
  - name: MaterialBuffer
    kind: Buffer
  - name: PrimitiveMaterialBuffer
    kind: Buffer
  - name: ElementPrimitiveBuffer
    kind: Buffer
  - name: CornerTangentBuffer
    kind: Buffer
  - name: CornerColorBuffer
    kind: Buffer
  - name: CornerUvBuffer
    kind: Buffer

enums:
  - name: MaterialAlphaMode
    type: u32
    values:
      - name: Opaque
      - name: Mask
      - name: Blend
  - name: PunctualLightType
    type: u32
    values:
      - name: Directional
      - name: Point
      - name: Spot
  - name: InteractionMode
    type: u32
    values:
      - name: Object
      - name: Edit
      - name: Excite
      - name: Pose
        value: 3
  - name: EditSelectionOperation
    type: u32
    values:
      - name: Derive
      - name: Clear
      - name: Fill
      - name: FillList
      - name: CaptureBaseline
      - name: RestoreBaseline
      - name: PickReplace
      - name: PickToggle
      - name: ClearActive
  - name: EditSharpnessOperation
    type: u32
    values:
      - name: SetAllFaces
      - name: SmoothAll
      - name: SmoothByAngle
      - name: SetSelectedFaces
      - name: SetSelectedEdges
      - name: SetVertexEdges
  - name: ExtrasLineKind
    type: u32
    values:
      - name: Empty
      - name: Camera
      - name: LightPoint
      - name: LightDirectional
      - name: LightSpot
      - name: ColliderBox
      - name: ColliderSphere
      - name: ColliderCylinder
      - name: ColliderCapsule
  - name: OverlayJobKind
    type: u32
    values:
      - name: Extras
      - name: Bounds
      - name: TetWire
  - name: OverlayDispatch
    type: u32
    values:
      - name: LineGroupLines
        value: 48
      - name: ColliderCircleSegments
        value: 48
      - name: LightRangeSegments
        value: 32
      - name: SpotConeSegments
        value: 32
      - name: ExtrasHaloLines
        value: 27
      - name: BoneSolidVertices
        value: 24
      - name: BoneWireVertices
        value: 24
      - name: BoneSphereVertices
        value: 96
      - name: BoneSphereWireVertices
        value: 64
  - name: Element
    type: u32
    values:
      - name: None
        value: 0
      - name: Vertex
        value: 1
      - name: Edge
        value: 2
      - name: Face
        value: 4
  - name: DebugChannel
    type: u32
    values:
      - name: None
      - name: UvCoords0
      - name: UvCoords1
      - name: NormalTexture
      - name: NormalGeometry
      - name: Tangent
      - name: Bitangent
      - name: TangentW
      - name: NormalShading
      - name: Alpha
      - name: Occlusion
      - name: Emissive
      - name: BaseColor
      - name: Metallic
      - name: Roughness
      - name: ClearcoatFactor
      - name: ClearcoatRoughness
      - name: ClearcoatNormal
      - name: SheenColor
      - name: SheenRoughness
      - name: SpecularFactor
      - name: SpecularColor
      - name: TransmissionFactor
      - name: VolumeThickness
      - name: DiffuseTransmissionFactor
      - name: DiffuseTransmissionColor
      - name: IridescenceFactor
      - name: IridescenceThickness
      - name: AnisotropyStrength
      - name: AnisotropyDirection
  # The top two bits select vertex, face, or normal-sector shading; the low 30 bits index the sector.
  - name: CornerClass
    type: u32
    values:
      - name: Vertex
      - name: Face
      - name: Seam
  # UniformFaceOffset and InvalidOffset encode uniform Face and Vertex classification without a class buffer.
  - name: CornerClassEncoding
    type: u32
    values:
      - name: TagShift
        value: 30
      - name: IndexMask
        value: 0x3fffffffu
      - name: UniformFaceOffset
        value: 0xfffffffeu
  # Packs loop position above face index for Blender-style corner-angle-weighted normal accumulation.
  # Supports up to 4.2 million faces per mesh and face valence up to 1024.
  - name: FanItemEncoding
    type: u32
    values:
      - name: LoopShift
        value: 22
      - name: FaceMask
        value: 0x3fffffu
  - name: VertexAdjacencyKind
    type: u32
    values:
      - name: Fan
      - name: Edge
  # Packs local triangle, visible-list meshlet index, and phase into low, middle, and top bits.
  - name: VisibilityId
    type: u32
    values:
      - name: TriangleBits
        value: 6
      - name: IndexBits
        value: 25
  # Stores one counter per color class followed by nearest-line depth.
  - name: WireCoverage
    type: u32
    values:
      - name: Base
        value: 0
      - name: Selected
        value: 1
      - name: Active
        value: 2
      - name: Incidental
        value: 3
      - name: DepthWord
        value: 4
      - name: WordsPerPixel
        value: 5
  - name: MeshletInstanceFlag
    type: u32
    values:
      - name: Silhouette
        value: 1u
      - name: ElementSelection
        value: 2u
      # Restrict edited and deformed instances to original source geometry.
      - name: LodPinFinest
        value: 4u
      # Emit source edges and points from original meshlets for the primary edit instance.
      - name: EditOverlay
        value: 8u
      # Provide canonical source edges from original meshlets for wire rasterization.
      - name: Wire
        value: 16u
      # Route procedural and editor-only geometry outside material visibility.
      - name: OverlayOnly
        value: 32u
      - name: Bone
        value: 64u
      - name: BoneWire
        value: 128u
      - name: BoneJoint
        value: 256u
      - name: BoneJointWire
        value: 512u
      - name: FaceNormal
        value: 1024u
      - name: VertexNormal
        value: 2048u
      - name: EdgeOverlay
        value: 4096u
      - name: PointOverlay
        value: 8192u
      # Use the persistent vertex-selection mask for excite-mode points.
      - name: SoundPoint
        value: 16384u
  - name: MeshPrimitiveTopology
    type: u32
    values:
      - name: Triangle
        value: 0
      - name: Line
        value: 1
      - name: Point
        value: 2
  # Defines deterministic compaction routes with separate fixed-function and discard-capable material visibility.
  - name: MeshletRoute
    type: u32
    values:
      - name: OpaqueCullBack
        value: 0
      - name: Blend
        value: 1
      - name: Transmission
        value: 2
      - name: Phase2Candidate
        value: 3
      - name: OpaqueCullFront
        value: 4
      - name: OpaqueDoubleSided
        value: 5
      - name: Coverage
        value: 6
      - name: EditOverlay
        value: 7
      - name: Wire
        value: 8
      - name: Overlay
        value: 9
      - name: Count
        value: 10
  - name: MeshletLimit
    type: u32
    values:
      - name: MaxVertices
        value: 64u
      - name: MaxTriangles
        value: 48u
  # Meshlet vertices pack flat-only and canonical-owner bits above the representative corner index.
  # Local triangle bytes pack all-flat above the first local vertex index.
  - name: MeshletGeometryEncoding
    type: u32
    values:
      - name: FlatVertexBit
        value: 0x80000000u
      - name: EditVertexOwnerBit
        value: 0x40000000u
      - name: CornerMask
        value: 0x3fffffffu
      - name: FlatTriangleBit
        value: 0x80u
      - name: LocalIndexMask
        value: 0x3fu
      # Triangle offsets use 30 bits; non-triangle records reuse the top two bits for MeshPrimitiveTopology.
      - name: LocalTriangleOffsetMask
        value: 0x3fffffffu
      - name: TopologyShift
        value: 30u
  # Packs canonical edit edge and reversed-winding flag; all bits set denotes an internal diagonal.
  # Stores only the first meshlet occurrence of each canonical edge.
  - name: MeshletEditEdgeEncoding
    type: u32
    values:
      - name: ReversedBit
        value: 0x80000000u
      - name: EdgeMask
        value: 0x7fffffffu
# Function-constant order defines matching shader and host indices.
function_constants:
  - name: PbrConstant
    constants:
      - name: EnablePunctual
        type: bool
      - name: EnableTransmission
        type: bool
      - name: EnableDiffuseTrans
        type: bool
      - name: EnableClearcoat
        type: bool
      - name: EnableSheen
        type: bool
      - name: EnableAnisotropy
        type: bool
      - name: EnableIridescence
        type: bool
      - name: TransmissionPrepass
        type: bool
      - name: VelocityOutput
        type: bool
      - name: NonTriangleTopology
        type: bool
  - name: MeshVertexConstant
    constants:
      - name: VelocityOutput
        type: bool
      - name: NonTriangleTopology
        type: bool
  - name: NormalIndicatorConstant
    constants:
      - name: NormalIndicatorFaces
        type: bool
  - name: EditOverlayConstant
    constants:
      - name: IncludeOuter
        type: bool
  - name: BackgroundConstant
    constants:
      - name: TransmissionPrepass
        type: bool

structs:
  - name: SlotOffset
    fields:
      - name: Slot
        type: u32
        default: InvalidSlot
      - name: Offset
        type: u32
  - name: EditSelectionStorage
    fields:
      - name: VertexBits
        type: SlotOffset
      - name: EdgeBits
        type: SlotOffset
      - name: FaceBits
        type: SlotOffset
      - name: Summary
        type: SlotOffset
  - name: DrawData
    fields:
      - name: VertexSlot
        type: u32
        default: InvalidSlot
      - name: IndexSlotOffset
        type: SlotOffset
      - name: ModelSlot
        type: u32
        default: InvalidSlot
      - name: FirstInstance
        type: u32
      - name: ObjectIdSlot
        type: u32
        default: InvalidSlot
      - name: CornerClassOffset
        type: u32
        default: InvalidOffset
      # Sparse corner normals use one presence/rank pair per 32 corners and one packed offset per present corner.
      # CornerBase locates the draw's first corner in the masks.
      - name: CustomCornerMaskOffset
        type: u32
        default: InvalidOffset
      - name: CustomCornerNormalOffset
        type: u32
        default: InvalidOffset
      - name: CornerBase
        type: u32
      # Sector normals use the low bits of a Seam class value as the index.
      - name: BaseSeamNormalOffset
        type: u32
        default: InvalidOffset
      - name: CornerTangentOffset
        type: u32
        default: InvalidOffset
      - name: CornerColorOffset
        type: u32
        default: InvalidOffset
      - name: CornerUvOffsets
        type: u32[4]
        default: InvalidOffset
      - name: FaceIdOffset
        type: u32
      # Base face normals mirror face-arena indexing.
      - name: BaseFaceNormalOffset
        type: u32
        default: InvalidOffset
      - name: FaceFirstTriangleOffset
        type: u32
        default: InvalidOffset
      - name: VertexEdgeAdjacencyOffset
        type: u32
        default: InvalidOffset
      - name: VertexFanAdjacencyOffset
        type: u32
        default: InvalidOffset
      - name: Connectivity
        type: SlotOffset
      - name: EdgeHalfedges
        type: SlotOffset
      - name: HalfedgeCount
        type: u32
      - name: FaceCount
        type: u32
      - name: ConnectivityFaceStarts
        type: u32
      - name: VertexCountOrHeadImageSlot
        type: u32
      - name: ElementIdOffset
        type: u32
      - name: Selection
        type: EditSelectionStorage
      - name: EdgeSharpnessOffset
        type: u32
        default: InvalidOffset
      - name: EditEdgeOffset
        type: u32
        default: InvalidOffset
      - name: InstanceStateSlot
        type: u32
        default: InvalidSlot
      - name: HasPendingVertexTransform
        type: u32
      - name: PrimaryEditInstanceIndex
        type: u32
        default: InvalidOffset
      - name: VertexOffset
        type: u32
      - name: BoneDeformOffset
        type: u32
        default: InvalidOffset
      - name: ArmatureDeformOffset
        type: u32
        default: InvalidOffset
      - name: MorphDeformOffset
        type: u32
        default: InvalidOffset
      - name: MorphWeightsOffset
        type: u32
        default: InvalidOffset
      - name: MorphTargetCount
        type: u32
      # Authored morph normals combine base normals with weighted authored deltas.
      # Edit-mode draws derive normals because edit mode creates no deform slots.
      - name: MorphShadingAuthored
        type: u32
      # Current-pose mesh-local positions and their derived vertex and sector normals.
      - name: PosedPositionOffset
        type: u32
        default: InvalidOffset
      - name: PosedVertexNormalOffset
        type: u32
        default: InvalidOffset
      - name: PosedSeamNormalOffset
        type: u32
        default: InvalidOffset
      - name: PosedFaceNormalOffset
        type: u32
        default: InvalidOffset
      - name: PrimitiveMaterialOffset
        type: u32
        default: InvalidOffset
      - name: ElementPrimitiveOffset
        type: u32
        default: InvalidOffset
  # Defines one persistent single-threadgroup procedural-line chunk with common visibility and indirect submission.
  - name: OverlayJob
    fields:
      - name: Kind
        type: OverlayJobKind
      - name: InstanceIndex
        type: u32
      - name: FirstElement
        type: u32
      - name: ElementCount
        type: u32
      - name: SourceOffset
        type: u32
      - name: IndexOffset
        type: u32
      - name: ExtrasKind
        type: ExtrasLineKind
      - name: LocalOffset
        type: vec3
      - name: Params
        type: vec4
  # Stores immutable mesh topology shared by all instances.
  # Non-triangle meshlets use triangle offset and count for logical line or point elements.
  - name: MeshletRecord
    fields:
      - name: TriangleOffset
        type: u32
      - name: TriangleCount
        type: u32
      - name: VertexOffset
        type: u32
      - name: VertexCount
        type: u32
      - name: LocalTriangleOffset
        type: u32
      - name: Primitive
        type: u32
      # A cluster renders when its group exceeds the error threshold and its refining group does not.
      # RefinedGroup is InvalidOffset for original geometry.
      - name: GroupIndex
        type: u32
        default: InvalidOffset
      - name: RefinedGroup
        type: u32
        default: InvalidOffset
      # Meshopt cone culling is exact only when every triangle uses its derived flat face normal.
      # Mixed-normal meshlets use cutoff 127 to disable cone culling.
      - name: ConeAxisCutoff
        type: u32
      - name: Center
        type: vec3
      - name: Radius
        type: float
  # Stores immutable topology and shading once per mesh; instance records contain mutable state.
  - name: PrimitiveRecord
    fields:
      - name: Draw
        type: DrawData
      # Optional kind-specific indices for bone adjacency and ring geometry.
      - name: AuxIndices
        type: SlotOffset
      - name: PrimitiveIndex
        type: u32
      - name: FirstTriangle
        type: u32
      - name: MeshletOffset
        type: u32
      - name: MeshletCount
        type: u32
      # Original clusters form the first Level0Count records for pinned-instance drawing.
      - name: Level0Count
        type: u32
      # Identifies the full-run span root and the leaf covering the original-geometry prefix.
      - name: LodRootNode
        type: u32
        default: InvalidOffset
      - name: LodFinestNode
        type: u32
        default: InvalidOffset
  # Stores conservative mesh-space bounds and monotonic accumulated simplification error for one cluster group.
  # Contained member spheres and monotonic error produce a crack-free projected-error cut.
  - name: ClusterGroup
    fields:
      - name: Center
        type: vec3
      - name: Radius
        type: float
      - name: Error
        type: float
  # Covers a contiguous meshlet-record range with conservative bounds and maximum group error.
  # Leaves reference meshlet ranges; internal nodes reference child ranges.
  - name: LodNode
    fields:
      - name: Center
        type: vec3
      - name: Radius
        type: float
      - name: Error
        type: float
      - name: FirstMeshlet
        type: u32
      - name: MeshletCount
        type: u32
      - name: ChildOffset
        type: u32
      - name: ChildCount
        type: u32
  - name: InstanceRecord
    fields:
      - name: PrimitiveOffset
        type: u32
        default: InvalidOffset
      - name: PrimitiveCount
        type: u32
      - name: BoneDeformOffset
        type: u32
        default: InvalidOffset
      - name: ArmatureDeformOffset
        type: u32
        default: InvalidOffset
      - name: MorphDeformOffset
        type: u32
        default: InvalidOffset
      - name: MorphWeightsOffset
        type: u32
        default: InvalidOffset
      - name: MorphTargetCount
        type: u32
      - name: PosedPositionOffset
        type: u32
        default: InvalidOffset
      - name: PosedVertexNormalOffset
        type: u32
        default: InvalidOffset
      - name: PosedSeamNormalOffset
        type: u32
        default: InvalidOffset
      - name: PosedFaceNormalOffset
        type: u32
        default: InvalidOffset
      - name: PosedMeshletBoundsOffset
        type: u32
        default: InvalidOffset
      - name: Selection
        type: EditSelectionStorage
      - name: EditEdgeSharpnessOffset
        type: u32
        default: InvalidOffset
      - name: HasPendingVertexTransform
        type: u32
      - name: PrimaryEditInstanceIndex
        type: u32
        default: InvalidOffset
      - name: ObjectId
        type: u32
      - name: Flags
        type: u32
      - name: ElementIdOffset
        type: u32
      - name: ActiveVertex
        type: u32
        default: InvalidOffset
      - name: ExcitedVertex
        type: u32
        default: InvalidOffset
  - name: VisibleMeshlet
    fields:
      - name: Instance
        type: u32
      - name: Meshlet
        type: u32
  # Defines a producer-independent meshlet range with deterministic flattened WorkOffset ordering.
  - name: MeshletWorkRange
    fields:
      - name: Instance
        type: u32
      - name: MeshletOffset
        type: u32
      - name: MeshletCount
        type: u32
      - name: WorkOffset
        type: u32
  - name: MeshletWorkState
    fields:
      - name: RangeCount
        type: u32
      - name: MeshletCount
        type: u32
      - name: CullBlockCount
        type: u32
      - name: Phase2RangeCount
        type: u32
  # Associates a work instance with one span-tree node in the traversal frontier.
  - name: LodFrontierEntry
    fields:
      - name: Instance
        type: u32
      - name: Node
        type: u32
  # Stores traversal frontier size and dispatch block count for one level.
  - name: LodFrontierState
    fields:
      - name: NodeCount
        type: u32
      - name: BlockCount
        type: u32
  # Stores one traversal block's child nodes, leaf meshlet records, and phase-2 deferred instance ranges.
  - name: LodFrontierBlockState
    fields:
      - name: NodeCount
        type: u32
      - name: MeshletCount
        type: u32
      - name: Phase2RangeCount
        type: u32
  - name: MeshletCullBlockState
    fields:
      - name: Routes
        type: u32[10]
  - name: MeshletBlendBlockState
    fields:
      - name: Buckets
        type: u32[256]
  - name: MeshDispatchArgs
    fields:
      - name: ThreadgroupsX
        type: u32
      - name: ThreadgroupsY
        type: u32
      - name: ThreadgroupsZ
        type: u32
  - name: MeshletRouteState
    fields:
      - name: Counts
        type: u32[10]
      - name: Offsets
        type: u32[10]
      - name: BlendOffsets
        type: u32[256]
  # Defines one mesh's vertex-adjacency CSR build and its count/scatter scratch.
  # Edge jobs use edge-first bit ranks to derive edge indices.
  - name: VertexAdjacencyJob
    fields:
      - name: Corners
        type: SlotOffset
      - name: VertexCount
        type: u32
      - name: HalfedgeCount
        type: u32
      - name: Kind
        type: VertexAdjacencyKind
      # CSR storage contains VertexCount + 1 item offsets followed by items.
      - name: CsrOffset
        type: u32
      - name: CountsOffset
        type: u32
      - name: BlockOffset
        type: u32
      - name: BlockCount
        type: u32
      - name: EdgeFirstBitsOffset
        type: u32
        default: InvalidOffset
      - name: EdgeFirstRanksOffset
        type: u32
        default: InvalidOffset
  # Defines one mesh's vertex-weld inputs, outputs, and scratch layout.
  # Flags contain one mark per vertex plus a terminator for exclusive-scan index generation.
  - name: VertexWeldJob
    fields:
      # Position range used as the first weld-key channel and compacted output.
      - name: Positions
        type: SlotOffset
      # Corner array remapped to welded indices.
      - name: Corners
        type: SlotOffset
      # Source-vertex skin joints and weights; InvalidSlot denotes no skin.
      - name: Deform
        type: SlotOffset
      # Target-major morph position and normal deltas; InvalidSlot denotes no morph targets.
      - name: Morph
        type: SlotOffset
      - name: TargetCount
        type: u32
      # Target-major three-word morph tangent deltas staged in scratch; InvalidOffset denotes no authored tangents.
      - name: TangentOffset
        type: u32
        default: InvalidOffset
      - name: Count
        type: u32
      - name: CornerCount
        type: u32
      - name: TableOffset
        type: u32
      - name: TableMask
        type: u32
      - name: SlotOffset
        type: u32
      - name: FlagsOffset
        type: u32
      - name: BlockOffset
        type: u32
      - name: BlockCount
        type: u32
      - name: RemapOffset
        type: u32
      - name: RepsOffset
        type: u32
      # Stage welded channels to prevent in-place compaction from overwriting unread source data.
      - name: CompactOffset
        type: u32
      # Word stride of one staged welded vertex across all vertex-domain channels.
      - name: RecordWords
        type: u32
  # Defines one mesh's halfedge-connectivity output and scratch layout.
  # Output order is outgoing halfedges, opposites, edge-first bits, ranks, and samples.
  - name: MeshConnectivityJob
    fields:
      - name: Corners
        type: SlotOffset
      - name: Connectivity
        type: SlotOffset
      - name: VertexCount
        type: u32
      - name: HalfedgeCount
        type: u32
      - name: WordCount
        type: u32
      # Lower-endpoint buckets with counts, scatter cursors, and halfedge items.
      - name: CountsOffset
        type: u32
      - name: CursorsOffset
        type: u32
      - name: ItemsOffset
        type: u32
      - name: BlockOffset
        type: u32
      - name: BlockCount
        type: u32
      - name: PopcountOffset
        type: u32
      - name: WordBlockOffset
        type: u32
      - name: WordBlockCount
        type: u32
      # Stores total edge count and a non-manifold edge marker.
      - name: StateOffset
        type: u32
  # Defines one normal-derivation item with optional posed positions and push-constant-selected outputs.
  - name: NormalDeriveEntry
    fields:
      - name: PosedPositionOffset
        type: u32
        default: InvalidOffset
      - name: Vertices
        type: SlotOffset
      - name: FaceIndices
        type: SlotOffset
      - name: VertexCount
        type: u32
      # Vertex-fan CSR storage contains VertexCount + 1 offsets followed by FanItemEncoding values.
      - name: VertexAdjacencyOffset
        type: u32
      # Normal-sector CSR storage contains SeamCount + 1 offsets followed by FanItemEncoding values.
      - name: SeamFanOffset
        type: u32
      - name: SeamCount
        type: u32
      # Per-face first-triangle offsets bounded by TriangleCount.
      - name: FaceDataOffset
        type: u32
      - name: FaceCount
        type: u32
      - name: TriangleCount
        type: u32
      - name: VertexNormalOffset
        type: u32
      - name: SeamNormalOffset
        type: u32
      - name: FaceNormalOffset
        type: u32
  - name: IblSamplers
    fields:
      - name: DiffuseEnvSamplerSlot
        type: u32
      - name: SpecularEnvSamplerSlot
        type: u32
      - name: BrdfLutSamplerSlot
        type: u32
      - name: SpecularEnvMipCount
        type: u32
      - name: SheenEnvSamplerSlot
        type: u32
      - name: SheenEnvMipCount
        type: u32
      - name: SheenELutSamplerSlot
        type: u32
      - name: CharlieLutSamplerSlot
        type: u32
  - name: SceneViewUBO
    binding: SceneViewUBO
    fields:
