name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
        env:
          GIT_LFS_SKIP_SMUDGE: 1 # The RealImpact submodule's git-lfs meshes are only needed by the modal-corpus job

      - name: Install dependencies
        run: brew install llvm ninja

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-tests

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DMESHEDITOR_APP=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=/opt/homebrew/opt/llvm/bin/clang
          -DCMAKE_CXX_COMPILER=/opt/homebrew/opt/llvm/bin/clang++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build tests
        run: cmake --build build --target MeshEditorTests MeshEditorActionSerializeTest

      - name: Run tests
        run: |
          ./build/tests/MeshEditorActionSerializeTest
          ./build/tests/MeshEditorTests

  # Solves the full RealImpact mesh corpus and publishes the per-sample modes and profile
  # as a text artifact, tracking how commits change mode values and solve timing.
  modal-corpus:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
        env:
          GIT_LFS_SKIP_SMUDGE: 1 # Fetched below through the lfs cache

      - name: RealImpact corpus commit
        id: corpus
        run: echo "sha=$(git rev-parse @:external/RealImpact)" >> "$GITHUB_OUTPUT"

      - name: Cache RealImpact meshes
        uses: actions/cache@v4
        with:
          path: .git/modules/external/RealImpact/lfs
          key: realimpact-lfs-${{ steps.corpus.outputs.sha }}

      - name: Fetch RealImpact meshes
        run: git -C external/RealImpact lfs pull

      # The selection lives in the script, so a hit skips the HuggingFace download.
      - name: Cache Thingi10K meshes
        uses: actions/cache@v4
        with:
          path: external/TetCorpus/thingi10k
          key: thingi10k-${{ hashFiles('script/SetupTetCorpus') }}

      - name: Stage the mesh corpora
        run: python3 script/SetupTetCorpus --thingi10k

      - name: Install dependencies
        run: brew install llvm ninja eigen

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-modal-corpus

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DMESHEDITOR_APP=OFF
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=/opt/homebrew/opt/llvm/bin/clang
          -DCMAKE_CXX_COMPILER=/opt/homebrew/opt/llvm/bin/clang++
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --target MeshEditorModalSolverTest MeshEditorModalSolverBench

      - name: Run modal solver test
        run: ./build/tests/MeshEditorModalSolverTest

      # Catches a change that still produces a valid mesh but not the same one.
      - name: Check the tet corpus snapshot
        run: ./build/tests/MeshEditorModalSolverBench --dataset realimpact --dataset thingi10k --snapshot check

      - name: Run modal corpus
        shell: bash
        run: ./build/tests/MeshEditorModalSolverBench --corpus | tee modal-corpus.txt

      - name: Upload corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: modal-corpus
          path: modal-corpus.txt
